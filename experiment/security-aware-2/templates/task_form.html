{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
  <h1>{{ heading }}</h1>
  <form method="post" action="{{ action }}" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" value="{{ task['title'] }}" maxlength="200" required autofocus>
    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" maxlength="5000">{{ task['description'] }}</textarea>
    <label for="status">Status</label>
    <select id="status" name="status">
      {% for status in TASK_STATUSES %}
        <option value="{{ status }}" {% if task['status'] == status %}selected{% endif %}>{{ STATUS_LABELS[status] }}</option>
      {% endfor %}
    </select>
    <div class="form-actions">
      <button type="submit">Save</button>
      <a href="{{ url_for('task_list') }}">Cancel</a>
    </div>
  </form>
{% endblock %}
