{% extends "base.html" %}
{% block title %}Log in · Task Manager{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="card form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ username }}" maxlength="32" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
  <button type="submit">Log in</button>
</form>
<p>No account? <a href="{{ url_for('register') }}">Register</a>.</p>
{% endblock %}
