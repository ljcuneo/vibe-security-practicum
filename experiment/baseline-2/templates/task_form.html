{% extends 'base.html' %}

{% block title %}{{ 'Edit Task' if task else 'New Task' }}{% endblock %}

{% block content %}
  <h1>{{ 'Edit Task' if task else 'New Task' }}</h1>
  <form method="post" action="{{ form_action }}" class="form-card">
    <label for="title">Title</label>
    <input type="text" name="title" id="title" required autofocus
           value="{{ task['title'] if task else '' }}">

    <label for="description">Description</label>
    <textarea name="description" id="description" rows="5">{{ task['description'] if task else '' }}</textarea>

    <label for="status">Status</label>
    <select name="status" id="status">
      {% for value in statuses %}
        <option value="{{ value }}" {% if task and task['status'] == value %}selected{% elif not task and value == statuses[0] %}selected{% endif %}>
          {{ STATUS_LABELS[value] }}
        </option>
      {% endfor %}
    </select>

    <button type="submit">{{ 'Save Changes' if task else 'Create Task' }}</button>
  </form>
  <p><a href="{{ url_for('tasks_list') }}">&larr; Back to tasks</a></p>
{% endblock %}
