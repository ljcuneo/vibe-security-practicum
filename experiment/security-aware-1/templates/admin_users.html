{% extends "base.html" %}
{% block title %}Admin - Registered Users{% endblock %}
{% block content %}
<h1>Registered Users</h1>
<table class="task-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Created</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ "Admin" if user.is_admin else "User" }}</td>
            <td>{{ user.created_at }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
