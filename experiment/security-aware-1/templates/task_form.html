{% extends "base.html" %}
{% block title %}{% if task %}Edit Task{% else %}New Task{% endif %} - Task Manager{% endblock %}
{% block content %}
<h1>{% if task %}Edit Task{% else %}New Task{% endif %}</h1>
<form method="post" class="card-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="title">Title</label>
    <input type="text" id="title" name="title" value="{{ form_title }}" required maxlength="200" autofocus>

    <label for="description">Description</label>
    <textarea id="description" name="description" rows="6" maxlength="5000">{{ form_description }}</textarea>

    <label for="status">Status</label>
    <select id="status" name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if s == form_status %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
    </select>

    <div class="form-actions">
        <button type="submit">{% if task %}Save Changes{% else %}Create Task{% endif %}</button>
        <a class="button secondary" href="{{ url_for('list_tasks') }}">Cancel</a>
    </div>
</form>
{% endblock %}
