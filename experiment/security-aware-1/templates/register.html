{% extends "base.html" %}
{% block title %}Register - Task Manager{% endblock %}
{% block content %}
<h1>Register</h1>
<form method="post" class="card-form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username }}" required autofocus
           pattern="[A-Za-z0-9_]{3,32}" title="3-32 characters: letters, numbers, underscore">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">
    <p class="hint">At least 8 characters, including a letter and a number.</p>

    <label for="confirm_password">Confirm password</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="8">

    <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
