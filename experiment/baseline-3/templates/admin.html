{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<h1>Registered Users</h1>
<table>
  <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Tasks</th><th>Registered</th></tr></thead>
  <tbody>
  {% for u in users %}
    <tr>
      <td>{{ u.id }}</td>
      <td>{{ u.username }}</td>
      <td>{{ 'Admin' if u.is_admin else 'User' }}</td>
      <td>{{ u.task_count }}</td>
      <td>{{ u.created_at }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
