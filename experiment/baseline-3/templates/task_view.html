{% extends "base.html" %}
{% block title %}{{ task.title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ task.title }}</h1>
  <p><span class="status status-{{ task.status|lower|replace(' ', '-') }}">{{ task.status }}</span>
     <small>Created {{ task.created_at }}</small></p>
  <div class="description">{{ task.description or 'No description.' }}</div>
  <div class="row">
    <a class="button" href="{{ url_for('edit_task', task_id=task.id) }}">Edit</a>
    <form class="inline" method="post" action="{{ url_for('delete_task', task_id=task.id) }}"
          onsubmit="return confirm('Delete this task?');">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="danger">Delete</button>
    </form>
    <a href="{{ url_for('index') }}">Back to tasks</a>
  </div>
</div>
{% endblock %}
