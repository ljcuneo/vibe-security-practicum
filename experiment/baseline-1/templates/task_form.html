{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
    <h1>{{ heading }}</h1>
    <form method="post" class="form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required autofocus value="{{ task['title'] if task else '' }}">

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="4">{{ task['description'] if task else '' }}</textarea>

        <label for="status">Status</label>
        <select id="status" name="status">
            {% for choice in statuses %}
                <option value="{{ choice }}" {% if task and task['status'] == choice %}selected{% endif %}>{{ choice }}</option>
            {% endfor %}
        </select>

        <button type="submit">Save</button>
        <a class="button-secondary" href="{{ url_for('list_tasks') }}">Cancel</a>
    </form>
{% endblock %}
