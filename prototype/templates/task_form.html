{% extends "base.html" %}
{% block title %}{{ "Edit Task" if task else "New Task" }}{% endblock %}
{% block content %}
    <h2>{{ "Edit Task" if task else "New Task" }}</h2>
    <form method="post">
        <label>Title
            <input type="text" name="title" value="{{ task.title if task else '' }}" required autofocus>
        </label>
        <label>Description
            <textarea name="description" rows="4">{{ task.description if task else '' }}</textarea>
        </label>
        <label>Status
            <select name="status">
                {% for s in statuses %}
                    <option value="{{ s }}" {% if task and task.status == s %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </label>
        <button type="submit">Save</button>
        <a href="{{ url_for('dashboard') }}">Cancel</a>
    </form>
{% endblock %}
